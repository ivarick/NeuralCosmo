[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralcosmos"
version = "0.1.0"
description = "Simulator-robust neural inference of cosmological parameters across CAMELS simulation suites"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Meklati" }]
keywords = [
    "cosmology",
    "domain-generalization",
    "representation-learning",
    "CAMELS",
    "scientific-machine-learning",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24,<2.0",
    "torch>=2.1",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
viz = [
    "umap-learn>=0.5",
    "seaborn>=0.13",
]

[project.urls]
Repository = "https://github.com/ivarick/NeuralCosmos"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must run without raw CAMELS data present (plan section 79).
# Tests that genuinely need the ~11.8 GB archive are marked and deselected here.
addopts = "-q -m 'not requires_data'"
markers = [
    "requires_data: test requires the local CAMELS archive (CAMELS_DATA_ROOT)",
    "slow: test takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
