# ---------------------------------------------------------------------------
# E01 - IllustrisTNG in-domain baseline (plan sections 33, 68 Phase 3).
#
# This is gate B1 and milestone M2: can a standard CNN recover Omega_m and
# sigma8 at all, trained and tested within one suite? If this fails, the plan
# says stop and debug preprocessing, target mapping, normalization, splits,
# optimizer or architecture -- no research question is reachable until it
# passes.
#
# Astrid is declared as the sealed target so that the protocol guard is active
# even though this experiment never touches it.
# ---------------------------------------------------------------------------

experiment:
  id: E01_tng_id
  seed: 0
  notes: "In-domain baseline, IllustrisTNG -> IllustrisTNG. Gate B1."

data:
  config: configs/data/mtot.yaml
  split_file: configs/splits/split_v1.json
  normalizer: configs/normalizers/norm_IllustrisTNG-SIMBA_v1.json
  source_suites:
    - IllustrisTNG
  target_suites:
    - Astrid
  max_simulations: null
  augment: false
  # Hold the quantised source maps in RAM (plan section 83). The archive
  # is on a USB disk measured at ~19 MB/s cold, which starves the GPU.
  ram_cache: true

protocol:
  name: dg_strict
  use_target_for_training: false
  use_target_for_validation: false
  use_target_statistics: false

model:
  type: small_cnn
  latent_dim: 256
  width: 32
  depth: 5
  head_hidden: 128

training:
  epochs: 60
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 2
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 15
  warmup_epochs: 2

evaluation:
  splits: [val, test]
