# ---------------------------------------------------------------------------
# E11_simba_to_tng - SIMBA -> IllustrisTNG cross-suite transfer (plan sections 33, 68 Phase 4).
#
# This is the phase that decides whether the project has a testbed at all.
# Section 35 sets the kill criterion: if the OOD/ID error ratio is consistently
# below roughly 1.2-1.3 across both targets and both transfer directions, the
# total-matter field does not expose enough simulator shift to motivate the
# intended method, and the project pivots to a more baryon-sensitive field.
#
# IllustrisTNG is declared as the target, so the protocol forbids it from training,
# from validation and from the normalization statistics. Evaluating on it is
# the whole point and is permitted (section 18).
#
# Astrid does not appear. It stays sealed until the configuration is frozen.
# ---------------------------------------------------------------------------

experiment:
  id: E11_simba_to_tng
  seed: 0
  notes: "Cross-suite transfer SIMBA -> IllustrisTNG. Phase 4."

data:
  config: configs/data/mtot.yaml
  split_file: configs/splits/split_v1.json
  # SIMBA-train statistics only. Using IllustrisTNG statistics here would make this
  # target-stat-aware adaptation rather than domain generalization (section 21).
  normalizer: configs/normalizers/norm_SIMBA_v1.json
  source_suites:
    - SIMBA
  target_suites:
    - IllustrisTNG
  max_simulations: null
  augment: false
  ram_cache: true

protocol:
  name: dg_strict
  use_target_for_training: false
  use_target_for_validation: false
  use_target_statistics: false

model:
  type: small_cnn
  latent_dim: 256
  width: 32
  depth: 5
  head_hidden: 128

training:
  epochs: 60
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 2
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 15
  warmup_epochs: 2

evaluation:
  splits: [test]
  include_targets: true
